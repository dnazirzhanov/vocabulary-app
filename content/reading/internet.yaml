id: internet
title: The Internet
subtitle: How a network that started in 1969 grew into something billions of people use every day, and its dangers.
topic: technology
level: B1
source:
  name: Simple English Wikipedia, "Internet"
  url: https://simple.wikipedia.org/w/index.php?title=Internet&oldid=11040891
  license: CC BY-SA 4.0
  note: shortened; this adapted text is under the same licence
body:
  - The Internet is the world's largest global communication network for computers and other devices. It connects many smaller networks from homes, schools, businesses, and governments. These networks share different kinds of information. One of its most popular services is the World Wide Web, which is used by billions of people every day.
  - "## Where it began"
  - The Internet was developed in the United States by the Advanced Research Projects Agency (ARPA). It was first connected in October 1969 and was called ARPANET. The World Wide Web was created at CERN in Switzerland in 1990 by a British scientist named Tim Berners-Lee.
  - Today, people use Internet services by paying Internet Service Providers. Some websites and tools are free, while others may show ads to earn money.
  - "## What people use it for"
  - The Internet is used for many things, such as electronic mail, online chat, and sharing files. The most used service is the World Wide Web. The web contains websites, including social media, blogs, and wikis like Wikipedia. Webpages can be seen and read by anyone, unless the page needs a password or it is blocked.
  - The second biggest use of the Internet is to send and receive e-mail. E-mail is private and goes from one user to another. Instant messaging is similar to e-mail, but allows two or more people to chat to each other faster.
  - "## Dangers"
  - The Internet makes communication easy. Yet, communication can be dangerous, too. People often send secret information, and sometimes other people can steal that information. People can use the Internet to spread lies, steal secrets, or give dangerously bad advice.
  - Some websites may trick people into downloading viruses that can harm a computer, or spyware that watches what its users are doing and tells someone else. E-mails can have harmful files with them as attachments. Criminals may steal people's personal information or trick people into sending them money.
