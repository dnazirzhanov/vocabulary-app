id: tea
title: Tea
subtitle: After water, it is the drink people drink most. Black, green or oolong all come from one plant.
topic: culture
level: B1
source:
  name: Simple English Wikipedia, "Tea"
  url: https://simple.wikipedia.org/w/index.php?title=Tea&oldid=11057736
  license: CC BY-SA 4.0
