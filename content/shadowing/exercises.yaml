  language: en
  speaker: Anna (VOA Learning English)
  audio_filename: anna-hello.mp3
  transcript: "Hello, everyone. Hi there. I'm Anna, and I live in Washington, D.C. Every day I learn more about this great city. I live with Marsha. We're roommates. I'm Jonathan. I'm in apartment B4. I am in apartment C2. Here I am at my new job. I am your boss, Caty Weaver, but please call me Caty. Thank you, Ms. Weaver. Just Caty. Sure thing, Ms. Weaver. Okay, then. Every day I do my morning show. I have to go now. Goodbye. Goodbye, Anna."
