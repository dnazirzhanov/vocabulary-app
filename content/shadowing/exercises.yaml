- slug: technology-and-society
  title: Technology and Society
  description: How technology shapes our daily lives.
  difficulty: advanced
  duration_ms: 31541
  language: en
  speaker: null
  audio_filename: technology-and-society.mp3
  transcript: "Technology has changed almost every part of our lives. We use our phones to communicate, shop, work, and entertain ourselves. These changes have made many things faster and more convenient. However, spending too much time on screens can affect our health and our relationships. It is important to find a balance — to use technology as a tool that helps us, rather than something that controls us. The most important question is not what technology can do, but what we choose to do with it."
  sentences:
    - { start_ms: 0, end_ms: 5000, text: "Technology has changed almost every part of our lives." }
    - { start_ms: 5000, end_ms: 11500, text: "We use our phones to communicate, shop, work, and entertain ourselves." }
