- slug: morning-routine
  title: My Morning Routine
  description: A simple description of a daily morning routine.
  difficulty: beginner
  duration_ms: 17746
  language: en
  speaker: null
  audio_filename: morning-routine.mp3
  transcript: "I wake up at seven o'clock every morning. First, I brush my teeth and wash my face. Then I make a cup of coffee and eat breakfast. I usually have toast with eggs. After that, I get dressed and check my phone for messages. I leave the house at eight thirty and walk to the bus stop."
  sentences:
    - { start_ms: 0, end_ms: 3500, text: "I wake up at seven o'clock every morning." }
