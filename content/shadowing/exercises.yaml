- slug: day-at-work
  title: A Day at Work
  description: What a typical office workday looks like.
  difficulty: beginner
  duration_ms: 23865
  language: en
  speaker: null
  audio_filename: day-at-work.mp3
  transcript: "I arrive at the office at nine o'clock. I start by reading my emails and making a list of things to do. In the morning, I usually have one or two meetings with my team. We talk about our projects and solve problems together. At lunchtime, I go to a café near the office. In the afternoon, I focus on writing reports and replying to messages. I finish work at six."
  sentences:
    - { start_ms: 0, end_ms: 4000, text: "I arrive at the office at nine o'clock." }
    - { start_ms: 4000, end_ms: 9500, text: "I start by reading my emails and making a list of things to do." }
