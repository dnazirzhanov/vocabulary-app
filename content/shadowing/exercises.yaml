- slug: why-i-love-travelling
  title: Why I Love Travelling
  description: Reasons why travel is important and exciting.
  difficulty: intermediate
  duration_ms: 25271
  language: en
  speaker: null
  audio_filename: why-i-love-travelling.mp3
  transcript: "Travelling is one of my favourite things to do. When I visit a new country, I learn about different cultures, foods, and ways of life. I love trying local dishes and exploring streets I have never seen before. Meeting people from other places teaches me things that I could never learn from a book. Even when things go wrong, like a missed train or a lost bag, the experience makes me stronger and more confident."
  sentences:
    - { start_ms: 0, end_ms: 4500, text: "Travelling is one of my favourite things to do." }
    - { start_ms: 4500, end_ms: 11000, text: "When I visit a new country, I learn about different cultures, foods, and ways of life." }
    - { start_ms: 11000, end_ms: 17000, text: "I love trying local dishes and exploring streets I have never seen before." }
    - { start_ms: 17000, end_ms: 24000, text: "Meeting people from other places teaches me things that I could never learn from a book." }
    - { start_ms: 24000, end_ms: 35000, text: "Even when things go wrong, like a missed train or a lost bag, the experience makes me stronger and more confident." }

- slug: importance-of-education
  title: The Importance of Education
  description: Why learning and education matter throughout life.
  difficulty: intermediate
  duration_ms: 24979
  language: en
  speaker: null
  audio_filename: importance-of-education.mp3
  transcript: "Education is one of the most important things in a person's life. It gives us the knowledge and skills we need to find good jobs and make good decisions. But education is not only about school. We learn every day from our experiences, from other people, and from the things we read and watch. People who keep learning throughout their lives tend to be more creative and adaptable. It is never too late to start learning something new."
  sentences:
    - { start_ms: 0, end_ms: 5500, text: "Education is one of the most important things in a person's life." }
    - { start_ms: 5500, end_ms: 12000, text: "It gives us the knowledge and skills we need to find good jobs and make good decisions." }
