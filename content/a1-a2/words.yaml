# One entry per word. `id` is permanent: progress is stored against it, so never
# rename an id after release — change the headword or translation instead.
#
#   id            stable slug (lowercase letters, digits, hyphens)
#   headword      English word as taught
#   pos           noun | verb | adjective | adverb
#   translation   Russian meaning shown to the learner
#   also_accept   other English spellings accepted when typing (optional)
#   example       natural English sentence containing the headword as a whole word
#   example_ru    Russian translation of the example
#   illustration  id of an existing illustration (optional)

- id: house
  headword: house
  pos: noun
  translation: дом
  example: They live in a small house near the river.
  example_ru: Они живут в маленьком доме у реки.

- id: water
  headword: water
  pos: noun
  translation: вода
  example: Can I have a glass of water, please?
  example_ru: Можно мне стакан воды, пожалуйста?

- id: friend
  headword: friend
  pos: noun
  translation: друг, подруга
  example: My best friend lives in Bishkek.
  example_ru: Мой лучший друг живёт в Бишкеке.

- id: buy
  headword: buy
  pos: verb
  translation: покупать, купить
  example: I need to buy some bread.
  example_ru: Мне нужно купить хлеба.

- id: cheap
  headword: cheap
  pos: adjective
  translation: дешёвый
  example: This jacket is cheap.
  example_ru: Эта куртка дешёвая.

