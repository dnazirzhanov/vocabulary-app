[project]
name = "vocabulary-backend"
version = "0.1.0"
description = "API for the English vocabulary learning app"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "en-core-web-sm",
    "fastapi>=0.162.0",
    "fsrs>=6,<7",
    "httpx2>=2.16.0",
    "openai>=3.41.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.20",
    "pywebpush>=2.5.0,<3",
    "pyyaml>=6.0.3",
    "spacy>=3.7,<4",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
  "S101",   # assert: how pytest checks, and documents invariants in services
  "RUF001", # "ambiguous" characters: Cyrillic content and curly apostrophes are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ migrations folder would otherwise be mistaken for first-party code.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"loadtest/*" = ["S311", "S603", "S607", "E501"] # a local tool: seeded data, runs ps and uvicorn
"tests/*" = ["S311"] # seeded random is how tests make option order reproducible

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
# Web Push (ADR 0031) and yt-dlp (ADR 0100): no type information shipped.
module = ["pywebpush", "py_vapid", "py_vapid.*", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
log_level = "WARNING"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]
